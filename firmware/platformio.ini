; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; MoonPixel - moon lamp firmware
; Board: ESP32-C3 SuperMini (uses the generic ESP32-C3 DevKitM-1 definition)
; LEDs:  WS2812 5050 4-bit (2x2) panel

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; The SuperMini has no USB-UART chip: serial runs over the C3's native USB.
; These two flags make Serial print over that USB port.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
